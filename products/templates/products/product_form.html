{% extends 'base.html' %}

{% block title %}
    {% if is_edit %}Edit product{% else %}Create product{% endif %}
    — Stock Manager
{% endblock %}

{% block content %}
    <h1>
        {% if is_edit %}Edit product{% else %}Create product{% endif %}
    </h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            {% if is_edit %}Save changes{% else %}Create product{% endif %}
        </button>
    </form>

    <a href="{% url 'products:product_list' %}">
        Back to products
    </a>
{% endblock %}
